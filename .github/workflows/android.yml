name: Android Build and Glyph SDK Type Check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check protocol sample
        run: python3 scripts/check_protocol.py
      - name: Validate PowerShell helper syntax when pwsh is available
        shell: bash
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$t = $null; $e = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/build_glyph_windows.ps1", [ref]$t, [ref]$e) | Out-Null; if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_ }; exit 1 }'
          else
            echo "pwsh unavailable; optional PowerShell syntax test skipped"
          fi
      - name: Validate RD Flow 64 import bridge (no model downloads)
        run: |
          python3 -m pip install Pillow==12.0.0
          python3 -m unittest tools/test_rdflow_monster_bridge.py
      - name: Build debug APK (stub Glyph)
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :monsterquest:testDebugUnitTest :monsterquest:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GlyphLife-debug-stub
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MonsterQuest-debug
          path: monsterquest/build/outputs/apk/debug/*.apk
      - name: Build parallel-installable Monster Quest QA APK
        run: gradle --no-daemon -PmonsterquestQaInstall=true :monsterquest:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MonsterQuest-summon-fix-QA
          path: monsterquest/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MonsterQuest-PixelArt-Preview
          path: monsterquest/build/pixel-preview/*.png
          if-no-files-found: error

  # Deliberately opt-in via a commit message containing [ui-qa]. This captures
  # an actual Android-rendered screen, not a code-only illustration. It costs
  # emulator minutes and therefore is not run on every routine patch.
  ui-screenshot:
    name: Inspect actual Monster Quest exploration on emulator
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-qa]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build standalone Monster Quest APK
        run: gradle --no-daemon :monsterquest:assembleDebug
      # GitHub-hosted Linux runners can expose /dev/kvm but deny the runner
      # account access. Without KVM this emulator boot took 15 minutes and
      # the ADB screenshot command failed with a broken pipe.
      - name: Enable emulator acceleration on the isolated CI runner
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo 'KVM device unavailable; the emulator may be slow'
          fi
      - name: Boot emulator and photograph the genuine Compose UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 480
          disable-animations: true
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb install monsterquest/build/outputs/apk/debug/monsterquest-debug.apk
            adb shell am start -n dev.glyphlife.monsterquest/.MonsterQuestActivity
            sleep 6
            adb shell input tap 410 2255
            sleep 5
            mkdir -p monsterquest/build/ui-screenshot
            adb shell screencap -p /sdcard/monsterquest-explore.png
            adb pull /sdcard/monsterquest-explore.png monsterquest/build/ui-screenshot/explore.png
            adb shell uiautomator dump /sdcard/monsterquest-screen.xml || true
            adb pull /sdcard/monsterquest-screen.xml monsterquest/build/ui-screenshot/accessibility.xml || true
            # CI runner executes each YAML script line in its own shell.
            # Keep the battle search loop together and save the enemy screenshot.
            bash scripts/capture_monsterquest_battle.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MonsterQuest-UI-Emulator
          path: monsterquest/build/ui-screenshot/*
          if-no-files-found: warn

  glyph-sdk-compile:
    name: Compile Nothing Glyph SDK adapter (no artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch SDK from the official Nothing repo for compilation only
        shell: bash
        run: |
          mkdir -p app/libs
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/Nothing-Developer-Programme/GlyphMatrix-Developer-Kit/main/glyph-matrix-sdk-2.0.aar" \
            --output app/libs/glyph-matrix-sdk-2.0.aar
          test -s app/libs/glyph-matrix-sdk-2.0.aar
          echo "Official SDK downloaded for local compilation; it will not be uploaded."
      - name: Compile and package SDK-specific APK (not distributed)
        run: gradle --no-daemon :app:assembleDebug
      - name: Remove temporary vendor binary and APK
        if: always()
        run: |
          rm -f app/libs/glyph-matrix-sdk-2.0.aar
          rm -rf app/build/outputs/apk/debug
